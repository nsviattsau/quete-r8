<title>Le carnet d'Anatole</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Andika:wght@400;700&display=swap">
<style>
/* Layout : une page de cahier d'écolier (réglure Seyès + marge rouge), une question par page, tampons du maître pour juste/faux. Look papier assumé, un seul thème. */
:root{
  --desk:#e9e2d2; --paper:#fffdf6; --seyes:#b9cbe8; --seyes-strong:#8fa9d6; --margin:#e0525e;
  --ink:#1d3a8a; --pencil:#3a3a46; --red:#d1283a; --green:#1f8a4c; --gold:#f2b632;
  --hand:"Gochi Hand", "Comic Sans MS", "Marker Felt", cursive;
  --body:"Andika", "Trebuchet MS", system-ui, sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--desk);color:var(--pencil);font-family:var(--body);font-size:19px;line-height:1.5}
body.oops .page{animation:shake .45s 2}
@keyframes shake{20%{transform:translateX(-8px) rotate(-1deg)}40%{transform:translateX(8px) rotate(1deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--hand);font-size:26px;color:var(--ink);transform:rotate(-1.5deg)}
.step{font-family:var(--hand);font-size:20px;color:var(--pencil);font-variant-numeric:tabular-nums}
/* barre de progression = règle d'écolier */
.ruler{position:relative;height:26px;background:var(--gold);border-radius:4px;overflow:hidden;box-shadow:0 2px 0 #c58f15}
.ruler::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#5a430a 0 1px,transparent 1px 10px);height:8px;opacity:.6}
.ruler i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--green);opacity:.85;transition:width .6s}
.ruler-label{font-family:var(--hand);font-size:18px;color:var(--pencil);margin-top:-6px}
.page{position:relative;background-color:var(--paper);
  background-image:linear-gradient(90deg,transparent 52px,var(--margin) 52px 54px,transparent 54px),
    repeating-linear-gradient(0deg,transparent 0 31px,var(--seyes-strong) 31px 32px),
    repeating-linear-gradient(0deg,transparent 0 7px,var(--seyes) 7px 8px);
  border-radius:4px 10px 10px 4px;padding:26px 22px 26px 70px;display:flex;flex-direction:column;gap:16px;
  box-shadow:0 1px 0 #d8cfb8,0 10px 24px #6b5a3326;min-width:0}
.page::after{content:"";position:absolute;left:16px;top:20px;bottom:20px;width:14px;background:radial-gradient(circle,var(--desk) 5px,transparent 6px) 0 0/14px 40px repeat-y}
h1,h2{font-family:var(--hand);font-weight:400;color:var(--ink);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(32px,8vw,44px)} h2{font-size:clamp(28px,7vw,38px)}
.msg{margin:0}
.note{font-family:var(--hand);font-size:22px;color:var(--ink);transform:rotate(-1deg);margin:0}
.code{font-family:var(--hand);font-size:clamp(30px,9vw,44px);letter-spacing:.12em;color:var(--ink);text-align:center;padding:6px;font-variant-numeric:tabular-nums;overflow-x:auto}
.mirror{display:flex;justify-content:center;gap:clamp(10px,4vw,22px);flex-wrap:wrap}
.pair{display:inline-flex;font-family:var(--hand);font-size:clamp(38px,11vw,52px);color:var(--ink);line-height:1}
.pair span:last-child{transform:scaleX(-1);display:inline-block}
.pair.q{color:var(--red)}
.answers{display:grid;gap:10px}
button{font:inherit;cursor:pointer}
.ans{background:#fffdf6e6;color:var(--pencil);border:2px solid var(--ink);border-radius:14px 10px 16px 9px;padding:12px 16px;text-align:left;font-size:20px;display:flex;align-items:center;gap:12px;min-height:56px;box-shadow:3px 3px 0 var(--seyes-strong)}
.ans b{font-family:var(--hand);font-size:26px;color:var(--red);min-width:1.2em;font-weight:400}
.ans:hover{background:#fff4c4}
.ans:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--seyes-strong)}
.ans .pair{font-size:34px}
.ans:focus-visible,.big:focus-visible,.link:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.big{background:var(--ink);color:var(--paper);border:0;border-radius:14px 10px 14px 10px;padding:14px 20px;font-family:var(--hand);font-size:26px;box-shadow:3px 3px 0 #0e2260}
.big.red{background:var(--red);box-shadow:3px 3px 0 #8d1523}
.stamp{align-self:flex-start;font-family:var(--hand);font-size:30px;padding:2px 16px;border:3px solid currentColor;border-radius:10px;transform:rotate(-6deg)}
.stamp.ok{color:var(--green)} .stamp.bad{color:var(--red)}
.hide-box{background:#fff4c4;border-radius:2px;padding:14px 16px;font-size:22px;box-shadow:0 3px 8px #6b5a3330;transform:rotate(.8deg)}
.hide-box small{display:block;font-family:var(--hand);font-size:18px;color:var(--red);margin-bottom:2px}
.hint{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.hint-btn{background:#fff4c4;color:var(--ink);border:2px dashed var(--ink);border-radius:12px;padding:8px 14px;font-family:var(--hand);font-size:22px}
.hint-btn:hover{background:#ffeaa0}.hint-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hint-text{background:#fff4c4;border-left:4px solid var(--gold);padding:10px 14px;font-size:19px;border-radius:2px}
.hint-text small{display:block;font-family:var(--hand);font-size:18px;color:var(--red)}
.doodle{width:140px;height:auto;align-self:center}
.link{background:none;border:0;color:var(--pencil);text-decoration:underline;font-size:15px;align-self:center}
.parent{display:flex;flex-direction:column;gap:12px}
.parent label{display:block;font-size:15px;margin-bottom:3px}
.parent input{width:100%;box-sizing:border-box;background:#fff;color:var(--pencil);border:1px solid var(--seyes-strong);border-radius:6px;padding:9px;font:inherit;font-size:17px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.small{font-size:15px;margin:0}
.mission-tag{align-self:flex-start;font-family:var(--hand);font-size:20px;color:var(--paper);background:var(--green);padding:2px 12px;border-radius:8px;transform:rotate(-2deg)}
.story{font-family:var(--hand);font-size:23px;line-height:1.3;color:var(--ink);margin:0;transform:rotate(-.6deg)}
.todo{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.check{font-size:16px;margin:0}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:6px}
.role{background:#ffffffb3;border:1.5px solid var(--seyes-strong);border-radius:10px;padding:6px 10px;font-size:15px;line-height:1.3;min-width:0}
.role b{font-family:var(--hand);font-weight:400;font-size:19px;color:var(--red)}
.roles-mini{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;border-top:1px dashed var(--seyes-strong);padding-top:8px}
.roles-mini b{color:var(--ink)}
.timer{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.clock{font-family:var(--hand);font-size:46px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;min-width:3.2ch}
.clock.end{color:var(--green)}
.big.green{background:var(--green);box-shadow:3px 3px 0 #105a30}
.big.soft{background:#fff4c4;color:var(--ink);box-shadow:3px 3px 0 var(--seyes-strong);font-size:21px}
.big:disabled{opacity:.5;cursor:default}
.stamp.mission{align-self:center;font-size:clamp(30px,8vw,42px);color:var(--green);border:5px double var(--green);transform:rotate(-7deg);padding:6px 18px;text-align:center}
.pinbox input{max-width:9ch;font-size:28px;letter-spacing:.35em;text-align:center}
.err{color:var(--red);font-size:16px;margin:0;min-height:1em}
.sub{font-family:var(--hand);font-weight:400;font-size:24px;color:var(--ink);margin:6px 0 0}
.gifts{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.gifts li{background:#fff4c4;padding:10px 14px;font-size:21px;border-radius:2px;transform:rotate(var(--r,0deg));box-shadow:0 3px 8px #6b5a3330}
.page a{color:var(--ink)}
@media (max-width:420px){.page{padding-left:52px}.page{background-image:linear-gradient(90deg,transparent 38px,var(--margin) 38px 40px,transparent 40px),repeating-linear-gradient(0deg,transparent 0 31px,var(--seyes-strong) 31px 32px),repeating-linear-gradient(0deg,transparent 0 7px,var(--seyes) 7px 8px)}.page::after{left:10px}}
@media (prefers-reduced-motion:reduce){body.oops .page{animation:none}.ruler i{transition:none}}
</style>

<div class="wrap">
  <header>
    <div class="brand">Le carnet d'Anatole</div>
    <div class="step" id="stepLabel"></div>
  </header>
  <div class="ruler" aria-hidden="true"><i id="bar"></i></div>
  <div class="ruler-label" id="barLabel">Pièces : 0 / 8 · Missions : 0 / 3</div>
  <main class="page" id="page" aria-live="polite"></main>
  <button class="link" id="parentBtn" type="button">Mode parent</button>
</div>

<script>
/* Dessins génériques : une boîte qui déborde (début), une étoile-tampon (fin). Aucun personnage dessiné. */
const BOX=`<svg class="doodle" viewBox="0 0 140 110" aria-hidden="true" fill="none" stroke="#1d3a8a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<path d="M28 52 L70 40 L112 52 L112 96 L70 106 L28 96 Z" fill="#fff4c4"/><path d="M28 52 L70 64 L112 52 M70 64 V106"/>
<path d="M28 52 L14 34 L56 24 L70 40" fill="#fffdf6"/><path d="M112 52 L128 36 L86 26 L70 40" fill="#fffdf6"/>
<circle cx="40" cy="14" r="5" stroke="#d1283a"/><path d="M60 8 l6 6 m0 -6 l-6 6" stroke="#d1283a"/><rect x="92" y="6" width="9" height="9" stroke="#1f8a4c" transform="rotate(20 96 10)"/><path d="M118 16 q6 -8 10 0" stroke="#d1283a"/></svg>`;
const STAR=`<svg class="doodle" viewBox="0 0 140 130" aria-hidden="true"><path d="M70 8 L86 48 L130 50 L95 76 L108 120 L70 95 L32 120 L45 76 L10 50 L54 48 Z" fill="#f2b632" stroke="#1d3a8a" stroke-width="4" stroke-linejoin="round"/><text x="70" y="78" text-anchor="middle" font-family="Gochi Hand, cursive" font-size="24" fill="#1d3a8a">Bravo !</text></svg>`;

const pair=(d,q)=>`<span class="pair${q?' q':''}"><span>${d}</span><span>${d}</span></span>`;

const STEPS=[
 {title:"Le mot secret", text:"Pour que personne ne lise son carnet, Anatole écrit en chiffres : A = 1, B = 2, C = 3… Quel mot a-t-il écrit ?",
  extra:`<div class="code">12 · 21 · 14 · 5</div>`, answers:["PUCE","LUNE","TUBE"], ok:1, hide:"Sous un coussin du canapé",
  hint:"La première lettre est le L, car L = 12. Comptez sur vos doigts à partir de A !"},
 {title:"La devinette du jardin", text:"Anatole a trouvé une petite bête dans la cour de l'école : « Je porte ma maison sur mon dos et je laisse une trace qui brille. » Qui est-ce ?",
  answers:["La tortue","Le hérisson","L'escargot"], ok:2, hide:"Dans le panier à chaussures de l'entrée",
  hint:"Elle est très lente, elle a des antennes et elle sort quand il pleut."},
 {title:"La suite mystère", text:"Anatole a trouvé cette suite de lettres sur le tableau de la classe. Quelle lettre vient ensuite ?",
  extra:`<div class="code">J F M A M J ?</div>`, answers:["K","J","A"], ok:1, hide:"Derrière les livres de l'étagère",
  hint:"Ce ne sont pas des lettres au hasard : ce sont les premières lettres de mots que l'on dit 12 fois par an… Janvier, Février…"},
 {title:"Encore des lettres !", text:"Sur la page suivante, une autre suite. Quelle lettre manque ?",
  extra:`<div class="code">L M M J V S ?</div>`, answers:["T","S","D"], ok:2, hide:"Dans la boîte à jouets de la chambre",
  hint:"Pensez à l'école : on y va le Lundi, le Mardi… C'est la semaine !"},
 {title:"Les chiffres à l'envers", text:"Anatole a écrit chaque chiffre deux fois : une fois à l'endroit, une fois dans le miroir. Quel dessin vient ensuite ?",
  extra:`<div class="mirror">${pair(1)}${pair(2)}${pair(3)}${pair(4)}${pair('?',true)}</div>`,
  answers:[pair(6),pair(5),pair(8)], ok:1, html:true, hide:"Sous la nappe de la table",
  hint:"Cachez la moitié droite de chaque dessin avec votre main. Que voyez-vous : 1, 2, 3, 4… ?"},
 {title:"L'invention", text:"Dans la boîte d'Anatole, il manque une pièce : « J'ai des dents, mais je ne mords pas. Je fais tourner mes voisines. » Qu'est-ce que c'est ?",
  answers:["Le peigne","L'engrenage","La fusée"], ok:1, hide:"Dans la salle de bain, près des serviettes",
  hint:"On en trouve dans les montres, les vélos et les machines. C'est une petite roue."},
 {title:"Le calcul de roues", text:"Anatole veut construire 3 voitures. Chaque voiture a 4 roues. Combien de roues lui faut-il ?",
  answers:["7","10","12"], ok:2, hide:"Dans le placard de la cuisine, en bas",
  hint:"Dessinez 3 voitures et comptez leurs roues : 4 + 4 + 4."},
 {title:"La dernière page", text:"« Je monte, je monte et je ne redescends jamais. Aujourd'hui, c'est ma fête ! » Qui suis-je ?",
  answers:["L'âge","La fusée","L'ascenseur"], ok:0, hide:"La grande boîte finale, dans le salon",
  hint:"Ça se compte en années. Le jour de l'anniversaire, on a un an de plus !"}
];
/* Question bonus : obligatoire quand on a pris un indice. */
const BONUS=[
 {text:"Anatole a 10 billes. Il en perd 3, puis il en gagne 5. Combien en a-t-il ?", answers:["8","12","13"], ok:1},
 {text:"Quel nombre manque ? 5 · 10 · 15 · ? · 25", answers:["20","18","30"], ok:0},
 {text:"Lequel n'est pas un insecte ?", answers:["L'abeille","La fourmi","L'araignée"], ok:2},
 {text:"Combien de pattes ont 2 araignées ensemble ?", answers:["8","12","16"], ok:2},
 {text:"Quelle planète est la plus proche du Soleil ?", answers:["Mars","Mercure","Jupiter"], ok:1},
 {text:"Un vélo a 2 roues, un tricycle en a 3. Combien de roues pour 2 vélos et 1 tricycle ?", answers:["7","5","6"], ok:0},
 {text:"Avec A = 1, B = 2… quel mot est écrit ? 3 · 1 · 4 · 5 · 1 · 21", answers:["CADEAU","GATEAU","BATEAU"], ok:0},
 {text:"Quel animal pond des œufs ?", answers:["Le chat","La poule","Le lapin"], ok:1}
];
let bonusN=0, usedHint=false;
const OOPS=["Oh non, encore une catastrophe !","Patatras ! La boîte est tombée !","Oups ! Le carnet a pris l'eau !","Badaboum ! Tout s'est renversé !"];

const KEY="anatole-cachettes-v3";
function loadHides(){try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(Array.isArray(s))s.forEach((h,k)=>{if(STEPS[k]&&h)STEPS[k].hide=h});}catch(e){}}
function saveHides(){try{localStorage.setItem(KEY,JSON.stringify(STEPS.map(s=>s.hide)));return true}catch(e){return false}}
loadHides();

/* Missions de construction LEGO (briques en vrac fournies par l'adulte). */
const MISSIONS=[
 {title:"Construire un véhicule", story:"Anatole a besoin d'un véhicule pour transporter les pièces de son invention. Mais son véhicule est complètement cassé !",
  todo:["Prenez les briques LEGO que l'adulte vous donne.","Construisez ensemble un petit véhicule capable de transporter une pièce.","Gardez-le bien : il servira pour une autre mission !"],
  check:"L'adulte vérifie que le véhicule tient et qu'il peut transporter une pièce."},
 {title:"Le robot assistant", story:"Le robot assistant d'Anatole a perdu sa forme. Aidez-le à retrouver son apparence !",
  todo:["Construisez un petit robot avec une tête, un corps et des bras.","Chaque membre de la bande ajoute au moins une pièce.","Donnez un nom à votre robot !"],
  check:"L'adulte vérifie que chacun a ajouté au moins une pièce."},
 {title:"Le pont de secours", story:"Pour transporter les dernières pièces, Anatole doit traverser une rivière. Construisez un pont solide !",
  todo:["Faites deux petites tours de briques : ce sont les deux rives. Écartez-les d'une main.","Construisez ensemble un pont entre les deux rives.","Le test : faites passer le véhicule de la mission 1 sur le pont sans qu'il tombe !"],
  check:"L'adulte vérifie que le véhicule passe sur le pont et que tout le monde a participé."}
];
/* Parcours : r = énigme (index dans STEPS), m = mission (index dans MISSIONS). */
const ROUTE=[{r:0},{r:1},{m:0},{r:2},{r:3},{r:4},{r:5},{m:1},{r:6},{m:2},{r:7}];
const ROLES=[
 {name:"Le Décodeur", job:"lit la question ou la mission à voix haute"},
 {name:"Le Constructeur", job:"garde les pièces trouvées et dirige la construction"},
 {name:"L'Explorateur", job:"part chercher la cachette ou les briques"},
 {name:"Le Vérificateur", job:"vérifie que toute la bande est d'accord"}
];

const K_PROG="anatole-progression-v1", K_NAMES="anatole-noms-v1", K_PIN="anatole-code-v1";
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
let names=lsGet(K_NAMES,null); if(!Array.isArray(names)||names.length!==4)names=["","","",""];
let pin=String(lsGet(K_PIN,"")||"");

let pos=0, phase="q", started=false, actx=null, oopsN=0, tLeft=180, tId=null;
(function loadProgress(){const p=lsGet(K_PROG,null);if(p&&p.started){pos=Math.min(Math.max(0,p.pos|0),ROUTE.length);phase=p.phase||"q";usedHint=!!p.usedHint;bonusN=p.bonusN|0;oopsN=p.oopsN|0;started=true;}})();
function save(){lsSet(K_PROG,{pos,phase,usedHint,bonusN,oopsN,started:true});}
function resetProgress(){pos=0;phase="q";usedHint=false;started=false;lsDel(K_PROG);}

const page=document.getElementById("page");
const LETTERS=["A","B","C","D"];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const nameOf=j=>esc((names[j]||"").trim()||`Joueur ${j+1}`);
function stopTimer(){if(tId){clearInterval(tId);tId=null;}}
function show(html){stopTimer();page.innerHTML=html;}
function shake(){document.body.classList.remove("oops");void document.body.offsetWidth;document.body.classList.add("oops");}

function audio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();}catch(e){actx=null}return actx}
function tone(f1,f2,dur,type,vol){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f1,a.currentTime);o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+dur);g.gain.setValueAtTime(vol||.15,a.currentTime);g.gain.linearRampToValueAtTime(0,a.currentTime+dur);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+dur)}
function crash(){tone(400,60,.6,"sawtooth",.18);setTimeout(()=>tone(300,80,.4,"square",.1),180)}
function yay(){tone(660,660,.12,"triangle");setTimeout(()=>tone(880,880,.12,"triangle"),120);setTimeout(()=>tone(1320,1320,.2,"triangle"),240)}
function fanfare(){[0,160,320,480].forEach((t,n)=>setTimeout(()=>tone(523*Math.pow(1.26,n),523*Math.pow(1.26,n),.25,"triangle"),t));}

/* Rôles : ils tournent d'un cran après chaque mission réussie. */
function rot(){return ROUTE.slice(0,pos).filter(x=>x.m!=null).length;}
function childFor(r){return ((r-rot())%4+4)%4;}
function rolesFull(){return `<div class="roles">${ROLES.map((R,r)=>`<div class="role"><b>${R.name}</b> : ${nameOf(childFor(r))}<br>${R.job}</div>`).join("")}</div>`;}
function rolesMini(){return `<div class="roles-mini">${ROLES.map((R,r)=>`<span>${R.name.replace(/^(Le |L')/,"")} : <b>${nameOf(childFor(r))}</b></span>`).join("")}</div>`;}

function progress(){
  let done=pos+((phase==="reveal"||phase==="victory"||phase==="surprise")&&pos<ROUTE.length?1:0); if(done>ROUTE.length)done=ROUTE.length;
  const seen=ROUTE.slice(0,done), r=seen.filter(x=>x.r!=null).length, m=seen.filter(x=>x.m!=null).length;
  document.getElementById("bar").style.width=(done/ROUTE.length*100)+"%";
  document.getElementById("barLabel").textContent=`Pièces : ${r} / ${STEPS.length} · Missions : ${m} / ${MISSIONS.length}`;
  document.getElementById("stepLabel").textContent=started&&pos<ROUTE.length?`Étape ${pos+1} / ${ROUTE.length}`:"";
}

function intro(){
  phase=started?phase:"q";progress();document.getElementById("stepLabel").textContent="";
  const resumeBtn=started?`<button class="big green" id="resume" type="button">Reprendre la mission (étape ${Math.min(pos+1,ROUTE.length)})</button><button class="big red" id="restart" type="button">Recommencer depuis le début</button>`:`<button class="big" id="go" type="button">Ouvrir le carnet</button>`;
  show(`${BOX}<h1>Au secours, la bande !</h1>
  <p class="msg">Anatole préparait une invention secrète pour l'anniversaire : le Projet X. Il a voulu bien faire… et patatras ! La boîte est tombée, et toutes les pièces se sont éparpillées dans la maison.</p>
  <p class="msg">Heureusement, il a tout noté dans son carnet. Répondez à ses questions pour trouver les pièces, et réussissez ses missions de construction.</p>
  <p class="note">Attention : une mauvaise réponse, et c'est la catastrophe ! On recule d'une page.</p>
  <div class="row">${resumeBtn}</div>`);
  const go=document.getElementById("go"), rs=document.getElementById("resume"), rr=document.getElementById("restart");
  if(go)go.onclick=()=>{audio();if(!pin)setup(start);else start();};
  if(rs)rs.onclick=()=>{audio();resume();};
  if(rr)rr.onclick=()=>{rr.textContent="Sûr ? Appuyez encore pour tout recommencer";rr.onclick=()=>{resetProgress();intro();};};
}
function start(){yay();pos=0;phase="q";usedHint=false;started=true;save();go();}
function resume(){
  if(!started)return intro();
  switch(phase){case "bonus":return bonus();case "reveal":return reveal();case "mdone":return missionDone();case "victory":return victory();case "surprise":return surprise();default:return go();}
}
function go(){if(pos>=ROUTE.length)return victory();if(ROUTE[pos].m!=null)mission();else question();}

/* Préparation par l'adulte : code secret + prénoms. */
function setup(next){
  document.getElementById("stepLabel").textContent="Pour les adultes";
  show(`<h2>Préparation</h2>
  <p class="msg">Avant de commencer, un adulte choisit un code secret à 4 chiffres. Il sert à valider les missions de construction et à ouvrir le Mode parent.</p>
  <div class="parent pinbox"><div><label for="p1">Code secret</label><input id="p1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off"></div>
  <div><label for="p2">Encore une fois</label><input id="p2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off"></div></div>
  <p class="msg">Les prénoms de la bande, pour les rôles (facultatif) :</p>
  <div class="parent">${[0,1,2,3].map(j=>`<div><label for="n${j}">Enfant ${j+1}</label><input id="n${j}" value="${esc(names[j])}" autocomplete="off"></div>`).join("")}</div>
  <p class="err" id="err"></p>
  <div class="row"><button class="big" id="ok" type="button">C'est parti !</button><button class="big red" id="back" type="button">Retour</button></div>`);
  document.getElementById("ok").onclick=()=>{
    const a=document.getElementById("p1").value.trim(), b=document.getElementById("p2").value.trim();
    if(!/^\d{4}$/.test(a)){document.getElementById("err").textContent="Le code doit avoir 4 chiffres.";return;}
    if(a!==b){document.getElementById("err").textContent="Les deux codes ne sont pas pareils.";return;}
    pin=a;lsSet(K_PIN,pin);names=[0,1,2,3].map(j=>document.getElementById("n"+j).value.trim());lsSet(K_NAMES,names);next();
  };
  document.getElementById("back").onclick=intro;
}

/* Vérification par l'adulte avec le code secret. */
function pinCheck(title,msg,onOk,onCancel){
  show(`<h2>${title}</h2><p class="msg">${msg}</p>
  <div class="parent pinbox"><div><label for="pc">Code secret de l'adulte</label><input id="pc" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off"></div></div>
  <p class="err" id="err"></p>
  <div class="row"><button class="big green" id="ok" type="button">Valider</button><button class="big red" id="no" type="button">Retour</button></div>`);
  const inp=document.getElementById("pc");inp.focus({preventScroll:true});
  const tryIt=()=>{if(inp.value.trim()===pin)onOk();else{inp.value="";document.getElementById("err").textContent="Code incorrect. Demandez à un adulte !";}};
  document.getElementById("ok").onclick=tryIt;
  inp.onkeydown=e=>{if(e.key==="Enter")tryIt();};
  document.getElementById("no").onclick=onCancel;
}

function question(){
  phase="q";save();progress();
  const s=STEPS[ROUTE[pos].r];
  show(`<h2>${s.title}</h2><p class="msg">${s.text}</p>${s.extra||""}
  <div class="answers">${s.answers.map((a,k)=>`<button class="ans" type="button" data-k="${k}"><b>${LETTERS[k]}</b><span>${a}</span></button>`).join("")}</div>
  <div class="hint" id="hintZone">${usedHint?`<div class="hint-text"><small>Indice</small>${s.hint}</div>`:`<button class="hint-btn" id="hintBtn" type="button">Besoin d'un indice ?</button><p class="small">Un indice coûte une question bonus.</p>`}</div>
  ${rolesMini()}`);
  page.querySelectorAll(".ans").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  const hb=document.getElementById("hintBtn");
  if(hb)hb.onclick=()=>{usedHint=true;save();document.getElementById("hintZone").innerHTML=`<div class="hint-text"><small>Indice</small>${s.hint}</div><p class="small">Après la bonne réponse, il faudra répondre à une question bonus.</p>`;};
  page.querySelector(".ans").focus({preventScroll:true});
}

function bonus(){
  phase="bonus";save();progress();
  const b=BONUS[bonusN%BONUS.length];
  show(`<div class="stamp ok">Juste !</div><h2>Question bonus</h2>
  <p class="msg">Vous avez pris un indice : répondez à cette question pour gagner la pièce.</p>
  <p class="msg">${b.text}</p>
  <div class="answers">${b.answers.map((a,k)=>`<button class="ans" type="button" data-k="${k}"><b>${LETTERS[k]}</b><span>${a}</span></button>`).join("")}</div>`);
  page.querySelectorAll(".ans").forEach(el=>el.onclick=()=>{
    bonusN++;
    if(+el.dataset.k===b.ok){yay();usedHint=false;reveal();}
    else{crash();shake();save();
      show(`<div class="stamp bad">${OOPS[oopsN++%OOPS.length]}</div><p class="msg">Mauvaise réponse à la question bonus. Voici une autre question !</p>
      <button class="big red" id="retry" type="button">Nouvelle question bonus</button>`);
      document.getElementById("retry").onclick=bonus;}
  });
  page.querySelector(".ans").focus({preventScroll:true});
}

function answer(k){
  const s=STEPS[ROUTE[pos].r];
  if(k===s.ok){yay();if(usedHint)bonus();else reveal();}
  else wrong();
}

function reveal(){
  phase="reveal";save();progress();
  const s=STEPS[ROUTE[pos].r], last=pos===ROUTE.length-1;
  show(`<div class="stamp ok">Très bien !</div>
  <div class="hide-box"><small>${last?"La grande boîte est…":"La pièce est cachée…"}</small>${esc(s.hide)}</div>
  <p class="small">${nameOf(childFor(2))}, l'Explorateur, mène la bande à la cachette !</p>
  <button class="big" id="next" type="button">${last?"On a tout trouvé !":"Trouvée ! Page suivante"}</button>`);
  document.getElementById("next").onclick=()=>{pos++;usedHint=false;phase="q";save();go();};
}

function wrong(){
  crash();shake();
  const prevIsRiddle=pos>0&&ROUTE[pos-1].r!=null, back=prevIsRiddle?pos-1:pos, moved=back!==pos;
  const msg=moved?"La page s'est envolée ! Retour à la page précédente.":(pos>0&&ROUTE[pos-1].m!=null?"Heureusement, votre construction est sauvée ! Il faut juste recommencer cette page.":"Il faut recommencer cette page.");
  pos=back;if(moved)usedHint=false;phase="q";save();progress();
  show(`<div class="stamp bad">${OOPS[oopsN++%OOPS.length]}</div>
  <p class="msg">${msg}</p>
  <button class="big red" id="retry" type="button">On répare et on continue</button>`);
  document.getElementById("retry").onclick=go;
}

/* Écran de mission : histoire, consignes, rôles, chrono facultatif, validation par l'adulte. */
function fmt(s){const m=Math.floor(s/60),r=s%60;return m+":"+String(r).padStart(2,"0");}
function mission(){
  phase="mission";save();progress();
  const k=ROUTE[pos].m, M=MISSIONS[k];
  show(`<div class="mission-tag">Mission de construction ${k+1} / ${MISSIONS.length}</div>
  <h2>${M.title}</h2>
  <p class="story">« ${M.story} »</p>
  <ol class="todo">${M.todo.map(t=>`<li>${t}</li>`).join("")}</ol>
  ${rolesFull()}
  <div class="timer"><span class="clock" id="clock">3:00</span><button class="big soft" id="tStart" type="button">Lancer le chrono</button></div>
  <p class="small" id="tMsg">Le chrono est juste là pour encourager. Personne ne perd !</p>
  <div class="row"><button class="big green" id="done" type="button">Mission accomplie !</button><button class="big soft" id="more" type="button">Besoin d'un peu plus de temps ?</button></div>
  <p class="check">${M.check}</p>`);
  tLeft=180;
  const clock=document.getElementById("clock"), msg=document.getElementById("tMsg");
  const tick=()=>{tLeft--;clock.textContent=fmt(Math.max(0,tLeft));if(tLeft<=0){stopTimer();clock.classList.add("end");tone(523,392,.5,"sine",.12);msg.textContent="Le temps est écoulé, mais pas de panique ! Finissez tranquillement.";}};
  const run=()=>{if(!tId&&tLeft>0)tId=setInterval(tick,1000);};
  document.getElementById("tStart").onclick=e=>{audio();e.target.disabled=true;run();};
  document.getElementById("more").onclick=()=>{tLeft=Math.max(0,tLeft)+60;clock.textContent=fmt(tLeft);clock.classList.remove("end");msg.textContent="Une minute de plus ! Prenez votre temps.";if(document.getElementById("tStart").disabled)run();};
  document.getElementById("done").onclick=()=>pinCheck(`Mission ${k+1} : vérification`,`${M.check} Si c'est bon, l'adulte tape son code.`,()=>{pos++;phase="mdone";save();missionDone();},mission);
}
function missionDone(){
  phase="mdone";save();progress();fanfare();
  const k=ROUTE[pos-1].m;
  show(`<div class="stamp mission">MISSION RÉUSSIE !</div>
  <p class="msg">Bravo, la bande ! Mission ${k+1} terminée. Anatole est très fier de vous.</p>
  ${k<MISSIONS.length-1?`<p class="note">On change les rôles !</p>${rolesFull()}`:`<p class="note">Il reste une dernière page du carnet…</p>`}
  <button class="big" id="next" type="button">Page suivante</button>`);
  document.getElementById("next").onclick=()=>{phase="q";save();go();};
}

function victory(){
  pos=ROUTE.length;phase="victory";save();progress();document.getElementById("stepLabel").textContent="Projet X réparé";fanfare();
  show(`${STAR}<h1>BRAVO, LA BANDE ! VOUS AVEZ RÉPARÉ LE PROJET X !</h1>
  <p class="msg">Grâce à vous, Anatole a retrouvé toutes ses pièces, et vos constructions ont sauvé son invention.</p>
  <button class="big green" id="gift" type="button">Découvrir la surprise</button>`);
  document.getElementById("gift").onclick=surprise;
}
function surprise(){
  phase="surprise";save();progress();document.getElementById("stepLabel").textContent="Surprise !";yay();
  show(`${BOX}<h2>La surprise d'Anatole</h2>
  <p class="msg">Ouvrez la grande boîte : chacun y trouve son propre set LEGO, à emporter à la maison !</p>
  <ul class="gifts">${[0,1,2,3].map(j=>`<li style="--r:${[-1,1,-.5,.8][j]}deg">Un set LEGO pour ${nameOf(j)}</li>`).join("")}</ul>
  <p class="note">Joyeux anniversaire !</p>
  <button class="big red" id="again" type="button">Recommencer la quête</button>`);
  document.getElementById("again").onclick=()=>{const b=document.getElementById("again");b.textContent="Sûr ? Appuyez encore pour tout recommencer";b.onclick=()=>{resetProgress();intro();};};
}

/* Mode parent, protégé par le code secret. */
function parent(){
  if(!pin)return parentPanel();
  pinCheck("Mode parent","Réservé aux adultes : tapez le code secret.",parentPanel,()=>resume());
}
function parentPanel(){
  stopTimer();document.getElementById("stepLabel").textContent="Mode parent";
  show(`<h2>Mode parent</h2>
  <p class="small">Tout est enregistré sur cet appareil uniquement.</p>
  <h3 class="sub">La bande</h3>
  <div class="parent">${[0,1,2,3].map(j=>`<div><label for="n${j}">Enfant ${j+1}</label><input id="n${j}" value="${esc(names[j])}" autocomplete="off"></div>`).join("")}</div>
  <h3 class="sub">Les cachettes</h3>
  <div class="parent">${STEPS.map((s,k)=>`<div><label for="h${k}">Énigme ${k+1} · ${s.title}</label><input id="h${k}" value="${esc(s.hide)}"></div>`).join("")}</div>
  <h3 class="sub">Code secret</h3>
  <div class="parent pinbox"><div><label for="np">${pin?"Nouveau code (laisser vide pour garder l'actuel)":"Choisir un code à 4 chiffres"}</label><input id="np" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off"></div></div>
  <p class="err" id="err"></p>
  <div class="row"><button class="big" id="save" type="button">Enregistrer</button><button class="big soft" id="back" type="button">Retour au jeu</button></div>
  <p class="small" id="saved"></p>
  <h3 class="sub">Progression</h3>
  <p class="small">${started?`La quête est à l'étape ${Math.min(pos+1,ROUTE.length)} sur ${ROUTE.length}.`:"La quête n'a pas encore commencé."}</p>
  <div class="row"><button class="big red" id="reset" type="button">Remettre la quête à zéro</button></div>
  <p class="small"><a href="https://github.com/nsviattsau/quete-r8#readme" target="_blank" rel="noopener">Plan de la fête et réponses (GitHub)</a></p>`);
  document.getElementById("save").onclick=()=>{
    const np=document.getElementById("np").value.trim();
    if(np&&!/^\d{4}$/.test(np)){document.getElementById("err").textContent="Le code doit avoir 4 chiffres.";return;}
    document.getElementById("err").textContent="";
    if(np){pin=np;lsSet(K_PIN,pin);document.getElementById("np").value="";}
    names=[0,1,2,3].map(j=>document.getElementById("n"+j).value.trim());
    STEPS.forEach((s,k)=>{const v=document.getElementById("h"+k).value.trim();if(v)s.hide=v});
    const ok=saveHides()&&lsSet(K_NAMES,names);
    document.getElementById("saved").textContent=ok?"Enregistré.":"Gardé pour cette séance (l'appareil ne permet pas l'enregistrement).";
  };
  document.getElementById("back").onclick=()=>resume();
  const rb=document.getElementById("reset");
  rb.onclick=()=>{rb.textContent="Sûr ? Appuyez encore pour remettre à zéro";rb.onclick=()=>{resetProgress();intro();};};
}
document.getElementById("parentBtn").onclick=parent;
intro();
</script>
