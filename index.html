<title>Le carnet d'Anatole</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Andika:wght@400;700&display=swap">
<style>
/* Layout : une page de cahier d'écolier (réglure Seyès + marge rouge), une question par page, tampons du maître pour juste/faux. Look papier assumé, un seul thème. */
:root{
  --desk:#e9e2d2; --paper:#fffdf6; --seyes:#b9cbe8; --seyes-strong:#8fa9d6; --margin:#e0525e;
  --ink:#1d3a8a; --pencil:#3a3a46; --red:#d1283a; --green:#1f8a4c; --gold:#f2b632;
  --hand:"Gochi Hand", "Comic Sans MS", "Marker Felt", cursive;
  --body:"Andika", "Trebuchet MS", system-ui, sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--desk);color:var(--pencil);font-family:var(--body);font-size:19px;line-height:1.5}
body.oops .page{animation:shake .45s 2}
@keyframes shake{20%{transform:translateX(-8px) rotate(-1deg)}40%{transform:translateX(8px) rotate(1deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--hand);font-size:26px;color:var(--ink);transform:rotate(-1.5deg)}
.step{font-family:var(--hand);font-size:20px;color:var(--pencil);font-variant-numeric:tabular-nums}
/* barre de progression = règle d'écolier */
.ruler{position:relative;height:26px;background:var(--gold);border-radius:4px;overflow:hidden;box-shadow:0 2px 0 #c58f15}
.ruler::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#5a430a 0 1px,transparent 1px 10px);height:8px;opacity:.6}
.ruler i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--green);opacity:.85;transition:width .6s}
.ruler-label{font-family:var(--hand);font-size:18px;color:var(--pencil);margin-top:-6px}
.page{position:relative;background-color:var(--paper);
  background-image:linear-gradient(90deg,transparent 52px,var(--margin) 52px 54px,transparent 54px),
    repeating-linear-gradient(0deg,transparent 0 31px,var(--seyes-strong) 31px 32px),
    repeating-linear-gradient(0deg,transparent 0 7px,var(--seyes) 7px 8px);
  border-radius:4px 10px 10px 4px;padding:26px 22px 26px 70px;display:flex;flex-direction:column;gap:16px;
  box-shadow:0 1px 0 #d8cfb8,0 10px 24px #6b5a3326;min-width:0}
.page::after{content:"";position:absolute;left:16px;top:20px;bottom:20px;width:14px;background:radial-gradient(circle,var(--desk) 5px,transparent 6px) 0 0/14px 40px repeat-y}
h1,h2{font-family:var(--hand);font-weight:400;color:var(--ink);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(32px,8vw,44px)} h2{font-size:clamp(28px,7vw,38px)}
.msg{margin:0}
.note{font-family:var(--hand);font-size:22px;color:var(--ink);transform:rotate(-1deg);margin:0}
.code{font-family:var(--hand);font-size:clamp(30px,9vw,44px);letter-spacing:.12em;color:var(--ink);text-align:center;padding:6px;font-variant-numeric:tabular-nums;overflow-x:auto}
.mirror{display:flex;justify-content:center;gap:clamp(10px,4vw,22px);flex-wrap:wrap}
.pair{display:inline-flex;font-family:var(--hand);font-size:clamp(38px,11vw,52px);color:var(--ink);line-height:1}
.pair span:last-child{transform:scaleX(-1);display:inline-block}
.pair.q{color:var(--red)}
.answers{display:grid;gap:10px}
button{font:inherit;cursor:pointer}
.ans{background:#fffdf6e6;color:var(--pencil);border:2px solid var(--ink);border-radius:14px 10px 16px 9px;padding:12px 16px;text-align:left;font-size:20px;display:flex;align-items:center;gap:12px;min-height:56px;box-shadow:3px 3px 0 var(--seyes-strong)}
.ans b{font-family:var(--hand);font-size:26px;color:var(--red);min-width:1.2em;font-weight:400}
.ans:hover{background:#fff4c4}
.ans:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--seyes-strong)}
.ans .pair{font-size:34px}
.ans:focus-visible,.big:focus-visible,.link:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.big{background:var(--ink);color:var(--paper);border:0;border-radius:14px 10px 14px 10px;padding:14px 20px;font-family:var(--hand);font-size:26px;box-shadow:3px 3px 0 #0e2260}
.big.red{background:var(--red);box-shadow:3px 3px 0 #8d1523}
.stamp{align-self:flex-start;font-family:var(--hand);font-size:30px;padding:2px 16px;border:3px solid currentColor;border-radius:10px;transform:rotate(-6deg)}
.stamp.ok{color:var(--green)} .stamp.bad{color:var(--red)}
.hide-box{background:#fff4c4;border-radius:2px;padding:14px 16px;font-size:22px;box-shadow:0 3px 8px #6b5a3330;transform:rotate(.8deg)}
.hide-box small{display:block;font-family:var(--hand);font-size:18px;color:var(--red);margin-bottom:2px}
.hint{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.hint-btn{background:#fff4c4;color:var(--ink);border:2px dashed var(--ink);border-radius:12px;padding:8px 14px;font-family:var(--hand);font-size:22px}
.hint-btn:hover{background:#ffeaa0}.hint-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hint-text{background:#fff4c4;border-left:4px solid var(--gold);padding:10px 14px;font-size:19px;border-radius:2px}
.hint-text small{display:block;font-family:var(--hand);font-size:18px;color:var(--red)}
.doodle{width:140px;height:auto;align-self:center}
.link{background:none;border:0;color:var(--pencil);text-decoration:underline;font-size:15px;align-self:center}
.parent{display:flex;flex-direction:column;gap:12px}
.parent label{display:block;font-size:15px;margin-bottom:3px}
.parent input{width:100%;box-sizing:border-box;background:#fff;color:var(--pencil);border:1px solid var(--seyes-strong);border-radius:6px;padding:9px;font:inherit;font-size:17px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.small{font-size:15px;margin:0}
@media (max-width:420px){.page{padding-left:52px}.page{background-image:linear-gradient(90deg,transparent 38px,var(--margin) 38px 40px,transparent 40px),repeating-linear-gradient(0deg,transparent 0 31px,var(--seyes-strong) 31px 32px),repeating-linear-gradient(0deg,transparent 0 7px,var(--seyes) 7px 8px)}.page::after{left:10px}}
@media (prefers-reduced-motion:reduce){body.oops .page{animation:none}.ruler i{transition:none}}
</style>

<div class="wrap">
  <header>
    <div class="brand">Le carnet d'Anatole</div>
    <div class="step" id="stepLabel"></div>
  </header>
  <div class="ruler" aria-hidden="true"><i id="bar"></i></div>
  <div class="ruler-label" id="barLabel">Pièces retrouvées : 0 sur 8</div>
  <main class="page" id="page" aria-live="polite"></main>
  <button class="link" id="parentBtn" type="button">Mode parent</button>
</div>

<script>
/* Dessins génériques : une boîte qui déborde (début), une étoile-tampon (fin). Aucun personnage dessiné. */
const BOX=`<svg class="doodle" viewBox="0 0 140 110" aria-hidden="true" fill="none" stroke="#1d3a8a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<path d="M28 52 L70 40 L112 52 L112 96 L70 106 L28 96 Z" fill="#fff4c4"/><path d="M28 52 L70 64 L112 52 M70 64 V106"/>
<path d="M28 52 L14 34 L56 24 L70 40" fill="#fffdf6"/><path d="M112 52 L128 36 L86 26 L70 40" fill="#fffdf6"/>
<circle cx="40" cy="14" r="5" stroke="#d1283a"/><path d="M60 8 l6 6 m0 -6 l-6 6" stroke="#d1283a"/><rect x="92" y="6" width="9" height="9" stroke="#1f8a4c" transform="rotate(20 96 10)"/><path d="M118 16 q6 -8 10 0" stroke="#d1283a"/></svg>`;
const STAR=`<svg class="doodle" viewBox="0 0 140 130" aria-hidden="true"><path d="M70 8 L86 48 L130 50 L95 76 L108 120 L70 95 L32 120 L45 76 L10 50 L54 48 Z" fill="#f2b632" stroke="#1d3a8a" stroke-width="4" stroke-linejoin="round"/><text x="70" y="78" text-anchor="middle" font-family="Gochi Hand, cursive" font-size="24" fill="#1d3a8a">Bravo !</text></svg>`;

const pair=(d,q)=>`<span class="pair${q?' q':''}"><span>${d}</span><span>${d}</span></span>`;

const STEPS=[
 {title:"Le mot secret", text:"Pour que personne ne lise son carnet, Anatole écrit en chiffres : A = 1, B = 2, C = 3… Quel mot a-t-il écrit ?",
  extra:`<div class="code">12 · 21 · 14 · 5</div>`, answers:["PUCE","LUNE","TUBE"], ok:1, hide:"Sous un coussin du canapé",
  hint:"La première lettre est le L, car L = 12. Comptez sur vos doigts à partir de A !"},
 {title:"La devinette du jardin", text:"Anatole a trouvé une petite bête dans la cour de l'école : « Je porte ma maison sur mon dos et je laisse une trace qui brille. » Qui est-ce ?",
  answers:["La tortue","Le hérisson","L'escargot"], ok:2, hide:"Dans le panier à chaussures de l'entrée",
  hint:"Elle est très lente, elle a des antennes et elle sort quand il pleut."},
 {title:"La suite mystère", text:"Anatole a trouvé cette suite de lettres sur le tableau de la classe. Quelle lettre vient ensuite ?",
  extra:`<div class="code">J F M A M J ?</div>`, answers:["K","J","A"], ok:1, hide:"Derrière les livres de l'étagère",
  hint:"Ce ne sont pas des lettres au hasard : ce sont les premières lettres de mots que l'on dit 12 fois par an… Janvier, Février…"},
 {title:"Encore des lettres !", text:"Sur la page suivante, une autre suite. Quelle lettre manque ?",
  extra:`<div class="code">L M M J V S ?</div>`, answers:["T","S","D"], ok:2, hide:"Dans la boîte à jouets de la chambre",
  hint:"Pensez à l'école : on y va le Lundi, le Mardi… C'est la semaine !"},
 {title:"Les chiffres à l'envers", text:"Anatole a écrit chaque chiffre deux fois : une fois à l'endroit, une fois dans le miroir. Quel dessin vient ensuite ?",
  extra:`<div class="mirror">${pair(1)}${pair(2)}${pair(3)}${pair(4)}${pair('?',true)}</div>`,
  answers:[pair(6),pair(5),pair(8)], ok:1, html:true, hide:"Sous la nappe de la table",
  hint:"Cachez la moitié droite de chaque dessin avec votre main. Que voyez-vous : 1, 2, 3, 4… ?"},
 {title:"L'invention", text:"Dans la boîte d'Anatole, il manque une pièce : « J'ai des dents, mais je ne mords pas. Je fais tourner mes voisines. » Qu'est-ce que c'est ?",
  answers:["Le peigne","L'engrenage","La fusée"], ok:1, hide:"Dans la salle de bain, près des serviettes",
  hint:"On en trouve dans les montres, les vélos et les machines. C'est une petite roue."},
 {title:"Le calcul de roues", text:"Anatole veut construire 3 voitures. Chaque voiture a 4 roues. Combien de roues lui faut-il ?",
  answers:["7","10","12"], ok:2, hide:"Dans le placard de la cuisine, en bas",
  hint:"Dessinez 3 voitures et comptez leurs roues : 4 + 4 + 4."},
 {title:"La dernière page", text:"« Je monte, je monte et je ne redescends jamais. Aujourd'hui, c'est ma fête ! » Qui suis-je ?",
  answers:["L'âge","La fusée","L'ascenseur"], ok:0, hide:"La grande boîte finale, dans le salon",
  hint:"Ça se compte en années. Le jour de l'anniversaire, on a un an de plus !"}
];
/* Question bonus : obligatoire quand on a pris un indice. */
const BONUS=[
 {text:"Anatole a 10 billes. Il en perd 3, puis il en gagne 5. Combien en a-t-il ?", answers:["8","12","13"], ok:1},
 {text:"Quel nombre manque ? 5 · 10 · 15 · ? · 25", answers:["20","18","30"], ok:0},
 {text:"Lequel n'est pas un insecte ?", answers:["L'abeille","La fourmi","L'araignée"], ok:2},
 {text:"Combien de pattes ont 2 araignées ensemble ?", answers:["8","12","16"], ok:2},
 {text:"Quelle planète est la plus proche du Soleil ?", answers:["Mars","Mercure","Jupiter"], ok:1},
 {text:"Un vélo a 2 roues, un tricycle en a 3. Combien de roues pour 2 vélos et 1 tricycle ?", answers:["7","5","6"], ok:0},
 {text:"Avec A = 1, B = 2… quel mot est écrit ? 3 · 1 · 4 · 5 · 1 · 21", answers:["CADEAU","GATEAU","BATEAU"], ok:0},
 {text:"Quel animal pond des œufs ?", answers:["Le chat","La poule","Le lapin"], ok:1}
];
let bonusN=0, usedHint=false;
const OOPS=["Oh non, encore une catastrophe !","Patatras ! La boîte est tombée !","Oups ! Le carnet a pris l'eau !","Badaboum ! Tout s'est renversé !"];

const KEY="anatole-cachettes-v3";
function loadHides(){try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(Array.isArray(s))s.forEach((h,k)=>{if(STEPS[k]&&h)STEPS[k].hide=h});}catch(e){}}
function saveHides(){try{localStorage.setItem(KEY,JSON.stringify(STEPS.map(s=>s.hide)));return true}catch(e){return false}}
loadHides();

let i=0, actx=null, oopsN=0;
const page=document.getElementById("page");
const LETTERS=["A","B","C","D"];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");

function audio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();}catch(e){actx=null}return actx}
function tone(f1,f2,dur,type,vol){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f1,a.currentTime);o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+dur);g.gain.setValueAtTime(vol||.15,a.currentTime);g.gain.linearRampToValueAtTime(0,a.currentTime+dur);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+dur)}
function crash(){tone(400,60,.6,"sawtooth",.18);setTimeout(()=>tone(300,80,.4,"square",.1),180)}
function yay(){tone(660,660,.12,"triangle");setTimeout(()=>tone(880,880,.12,"triangle"),120);setTimeout(()=>tone(1320,1320,.2,"triangle"),240)}

function progress(n){document.getElementById("bar").style.width=(n/STEPS.length*100)+"%";document.getElementById("barLabel").textContent=`Pièces retrouvées : ${n} sur ${STEPS.length}`;}

function intro(){
  document.getElementById("stepLabel").textContent="";progress(0);
  page.innerHTML=`${BOX}<h1>Au secours, la bande !</h1>
  <p class="msg">Anatole voulait préparer une invention surprise pour l'anniversaire. Il a voulu bien faire… et patatras ! La boîte est tombée, et toutes les pièces se sont éparpillées dans la maison.</p>
  <p class="msg">Heureusement, il a tout noté dans son carnet. Répondez à ses questions pour savoir où sont cachées les pièces.</p>
  <p class="note">Attention : une mauvaise réponse, et c'est la catastrophe ! On recule d'une page.</p>
  <button class="big" id="go" type="button">Ouvrir le carnet</button>`;
  document.getElementById("go").onclick=()=>{audio();yay();i=0;usedHint=false;question();};
}

function question(){
  const s=STEPS[i];
  document.getElementById("stepLabel").textContent=`Page ${i+1} / ${STEPS.length}`;progress(i);
  page.innerHTML=`<h2>${s.title}</h2><p class="msg">${s.text}</p>${s.extra||""}
  <div class="answers">${s.answers.map((a,k)=>`<button class="ans" type="button" data-k="${k}"><b>${LETTERS[k]}</b><span>${a}</span></button>`).join("")}</div>
  <div class="hint" id="hintZone">${usedHint?`<div class="hint-text"><small>Indice</small>${s.hint}</div>`:`<button class="hint-btn" id="hintBtn" type="button">Besoin d'un indice ?</button><p class="small">Un indice coûte une question bonus.</p>`}</div>`;
  page.querySelectorAll(".ans").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  const hb=document.getElementById("hintBtn");
  if(hb)hb.onclick=()=>{usedHint=true;document.getElementById("hintZone").innerHTML=`<div class="hint-text"><small>Indice</small>${s.hint}</div><p class="small">Après la bonne réponse, il faudra répondre à une question bonus.</p>`;};
  page.querySelector(".ans").focus({preventScroll:true});
}

function bonus(){
  const b=BONUS[bonusN%BONUS.length];
  page.innerHTML=`<div class="stamp ok">Juste !</div><h2>Question bonus</h2>
  <p class="msg">Vous avez pris un indice : répondez à cette question pour gagner la pièce.</p>
  <p class="msg">${b.text}</p>
  <div class="answers">${b.answers.map((a,k)=>`<button class="ans" type="button" data-k="${k}"><b>${LETTERS[k]}</b><span>${a}</span></button>`).join("")}</div>`;
  page.querySelectorAll(".ans").forEach(el=>el.onclick=()=>{
    bonusN++;
    if(+el.dataset.k===b.ok){usedHint=false;reveal();}
    else{crash();document.body.classList.remove("oops");void document.body.offsetWidth;document.body.classList.add("oops");
      page.innerHTML=`<div class="stamp bad">${OOPS[oopsN++%OOPS.length]}</div><p class="msg">Mauvaise réponse à la question bonus. Voici une autre question !</p>
      <button class="big red" id="retry" type="button">Nouvelle question bonus</button>`;
      document.getElementById("retry").onclick=bonus;}
  });
  page.querySelector(".ans").focus({preventScroll:true});
}

function answer(k){
  const s=STEPS[i];
  if(k===s.ok){
    yay();
    if(usedHint)bonus();else reveal();
  }else wrong();
}

function reveal(){
  const s=STEPS[i], last=i===STEPS.length-1;
  {
    progress(i+1);
    page.innerHTML=`<div class="stamp ok">Très bien !</div>
    <div class="hide-box"><small>${last?"La grande boîte est…":"La pièce est cachée…"}</small>${esc(s.hide)}</div>
    <button class="big" id="next" type="button">${last?"On a tout trouvé !":"Trouvée ! Page suivante"}</button>`;
    document.getElementById("next").onclick=()=>{if(last)victory();else{i++;usedHint=false;question();}};
  }
}

function wrong(){
  {
    crash();document.body.classList.remove("oops");void document.body.offsetWidth;document.body.classList.add("oops");
    const back=Math.max(0,i-1), moved=back!==i;
    page.innerHTML=`<div class="stamp bad">${OOPS[oopsN++%OOPS.length]}</div>
    <p class="msg">${moved?`La page s'est envolée ! Retour à la page ${back+1}.`:"Il faut recommencer cette page."}</p>
    <button class="big red" id="retry" type="button">On répare et on continue</button>`;
    i=back;progress(i);if(moved)usedHint=false;
    document.getElementById("retry").onclick=question;
  }
}

function victory(){
  document.getElementById("stepLabel").textContent="Mission réussie";progress(STEPS.length);
  page.innerHTML=`${STAR}<h2>Catastrophe réparée !</h2>
  <p class="msg">Grâce à vous, Anatole a toutes ses pièces. Maintenant, à vous de construire l'invention ! Joyeux anniversaire !</p>
  <button class="big" id="again" type="button">Recommencer</button>`;
  [0,160,320,480].forEach((t,n)=>setTimeout(()=>tone(523*Math.pow(1.26,n),523*Math.pow(1.26,n),.25,"triangle"),t));
  document.getElementById("again").onclick=intro;
}

function parent(){
  document.getElementById("stepLabel").textContent="Mode parent";
  page.innerHTML=`<h2>Les cachettes</h2>
  <p class="small">Écrivez où vous cachez chaque pièce. C'est enregistré sur cet appareil uniquement.</p>
  <div class="parent">${STEPS.map((s,k)=>`<div><label for="h${k}">Page ${k+1} · ${s.title}</label><input id="h${k}" value="${esc(s.hide)}"></div>`).join("")}</div>
  <div class="row"><button class="big" id="save" type="button">Enregistrer</button><button class="big red" id="back" type="button">Retour</button></div>
  <p class="small" id="saved"></p>`;
  document.getElementById("save").onclick=()=>{STEPS.forEach((s,k)=>{const v=document.getElementById("h"+k).value.trim();if(v)s.hide=v});document.getElementById("saved").textContent=saveHides()?"Enregistré.":"Gardé pour cette séance (l'appareil ne permet pas l'enregistrement).";};
  document.getElementById("back").onclick=intro;
}
document.getElementById("parentBtn").onclick=parent;
intro();
</script>
